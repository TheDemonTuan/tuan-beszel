name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install heartbeat dependencies
        run: npm --prefix heartbeat ci
      - name: Check heartbeat
        run: npm --prefix heartbeat run check
      - name: Check Worker bundle
        working-directory: heartbeat
        run: ./node_modules/.bin/wrangler deploy src/index.js --dry-run --no-bundle
      - name: Validate Compose
        env:
          APP_URL: http://127.0.0.1:8090
          HEARTBEAT_URL: https://example.invalid/push/ci-placeholder
          BESZEL_AGENT_TOKEN: ci-placeholder-token
          BESZEL_AGENT_KEY: ci-placeholder-key
        run: |
          docker compose config --quiet
          docker compose config --format json | node -e '
            const assert = require("node:assert/strict");
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const config = JSON.parse(input);
              const hub = config.services.beszel;
              const tag = hub.image.match(/^henrygd\/beszel:(\d+\.\d+\.\d+)(?:@sha256:[a-f0-9]{64})?$/)?.[1];
              const agentTag = config.services["beszel-agent"].image.match(/^henrygd\/beszel-agent:(\d+\.\d+\.\d+)(?:@sha256:[a-f0-9]{64})?$/)?.[1];
              assert.ok(tag, "Beszel Hub must use a pinned stable tag");
              assert.equal(agentTag, tag, "Beszel Hub and Agent must use the same release tag");
              assert.deepEqual(Object.keys(hub.networks).sort(), ["beszel-egress", "beszel-traefik"]);
              assert.equal(hub.labels["traefik.docker.network"], "beszel-traefik");
              assert.equal(config.networks["beszel-traefik"].name, "beszel-traefik");
              assert.equal(config.networks["beszel-traefik"].external, true);
            });
          '
